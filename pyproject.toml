[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolscells"
version = "0.1.0"
description = "Single-Molecule Single-Cells: Enhanced lineage tracing through integration of single-cell and bulk sequencing data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pedro Olivares", email = "pedro.olivares@weizmann.ac.il"}
]
maintainers = [
    {name = "Pedro Olivares", email = "pedro.olivares@weizmann.ac.il"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "polars>=0.18.0",
    #"cassiopeia-lineage>=2.0.0",
    "pyyaml>=6.0",
    "colorhash>=1.0.0",
    "click>=8.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "networkx>=2.6.0",
    "scipy>=1.7.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
]
viz = [
    "plotly>=5.0.0",
    "graphviz>=0.19.0",
]

[project.scripts]
smolscells = "smolscells.cli:main"

[project.urls]
Homepage = "https://github.com/tzeitim/smolscells"
Documentation = "https://smolscells.readthedocs.io"
Repository = "https://github.com/tzeitim/smolscells"
Issues = "https://github.com/tzeitim/smolscells/issues"

[tool.setuptools]
packages = ["smolscells"]

[tool.setuptools.package-data]
smolscells = ["configs/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
