[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61", "wheel" ]

[project]
name = "smolscells"
version = "0.1.0"
description = "Single-Molecule Single-Cells: Enhanced lineage tracing through integration of single-cell and bulk sequencing data"
readme = "README.md"
license = { text = "MIT" }
maintainers = [
  { name = "Pedro Olivares", email = "pedro.olivares@weizmann.ac.il" },
]
authors = [
  { name = "Pedro Olivares", email = "pedro.olivares@weizmann.ac.il" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8",
  "colorhash>=1",
  "matplotlib>=3.4",
  "networkx>=2.6",
  "numpy>=1.20",
  "pandas>=1.3",
  "polars>=0.18",
  #"cassiopeia-lineage>=2.0.0",
  "pyyaml>=6",
  "scipy>=1.7",
  "seaborn>=0.11",
  "tqdm>=4.62",
]

optional-dependencies.dev = [
  "ipykernel>=6",
  "jupyter>=1",
  "mypy>=0.950",
  "notebook>=6.4",
  "pytest>=7",
  "pytest-cov>=3",
]
optional-dependencies.viz = [
  "graphviz>=0.19",
  "plotly>=5",
]
urls.Documentation = "https://smolscells.readthedocs.io"
urls.Homepage = "https://github.com/tzeitim/smolscells"
urls.Issues = "https://github.com/tzeitim/smolscells/issues"
urls.Repository = "https://github.com/tzeitim/smolscells"
scripts.smolscells = "smolscells.cli:main"

[tool.setuptools]
packages = [ "smolscells" ]

[tool.setuptools.package-data]
smolscells = [ "configs/*.yaml" ]

[tool.ruff]
target-version = "py38"

line-length = 100
lint.select = [ "E", "F", "I", "W" ] # pycodestyle errors/warnings, pyflakes, isort

[tool.pytest.ini_options]
testpaths = [ "tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_functions = [ "test_*" ]
python_classes = [ "Test*" ]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
